name: adguard

services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    ports:
      - 53:53
      - 53:53
      - 4443:443/tcp
      - 8880:80/tcp
      - 3000:3000/tcp
    volumes:
      - work:/opt/adguardhome/work
      - conf:/opt/adguardhome/conf

volumes:
  work:
  conf:
