name: adguard

services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - 53:53
      - 53:53
      - 4443:443/tcp
      - 3000:3000/tcp
    volumes:
      - work:/opt/adguardhome/work
      - conf:/opt/adguardhome/conf

volumes:
  work:
  conf:
